##########################################
# 多开模式（可选）
##########################################
# 通过环境变量或 run_webui.py 启动多个 WebUI 实例，互不干扰：
#   python run_webui.py -i 1    # 端口 8501，数据目录 instances/1/
#   python run_webui.py -i 2    # 端口 8502，数据目录 instances/2/
# Windows: .\scripts\start_instance.ps1 -Instance 2
#
# 环境变量:
#   NARRATO_INSTANCE_ID  实例 ID（数字自动映射端口 8501、8502…）
#   NARRATO_PORT         显式指定端口（非数字 ID 时必须设置）

[app]
    project_version="0.7.8"

    # LLM API 超时配置（秒）
    llm_vision_timeout = 120  # 视觉模型基础超时时间
    llm_text_timeout = 180    # 普通文本生成超时（秒）
    llm_script_timeout = 600  # 解说脚本生成超时（秒，prompt 较长）
    llm_timeout_retries = 2   # 超时后额外重试次数
    llm_max_retries = 3       # API 重试次数

    ##########################################
    # 🚀 LLM 配置 - 使用 OpenAI 兼容统一接口
    ##########################################
    # 统一使用 OpenAI 兼容协议（/v1/chat/completions）
    # 支持接入 OpenAI、DeepSeek、Gemini 兼容网关、Qwen 网关、SiliconFlow、OpenRouter 等。

    # ===== 视觉模型配置 =====
    vision_llm_provider = "openai"

    # 模型格式：provider/model_name
    # 常用视觉模型示例：
    #   - Gemini: gemini/gemini-2.0-flash-lite (推荐，速度快成本低)
    #   - Gemini: gemini/gemini-1.5-pro (高精度)
    #   - OpenAI: gpt-4o, gpt-4o-mini
    #   - Qwen: qwen/qwen2.5-vl-32b-instruct
    #   - SiliconFlow: siliconflow/Qwen/Qwen2.5-VL-32B-Instruct
    vision_openai_model_name = "Qwen/Qwen3.5-122B-A10B"
    vision_openai_api_key = ""  # 填入对应 provider 的 API key
    vision_openai_base_url = "https://api.siliconflow.cn/v1"  # 可选：自定义 API base URL（官方 OpenAI 可留空）

    # ===== 文本模型配置 =====
    text_llm_provider = "openai"

    # 常用文本模型示例：
    #   - DeepSeek: deepseek/deepseek-chat (推荐，性价比高)
    #   - DeepSeek: deepseek/deepseek-reasoner (推理能力强)
    #   - Gemini: gemini/gemini-2.0-flash (速度快)
    #   - OpenAI: gpt-4o, gpt-4o-mini, gpt-4-turbo
    #   - Qwen: qwen/qwen-plus, qwen/qwen-turbo
    #   - SiliconFlow: siliconflow/deepseek-ai/DeepSeek-R1
    #   - Moonshot: moonshot/moonshot-v1-8k
    text_openai_model_name = "Pro/zai-org/GLM-5"
    text_openai_api_key = ""  # 填入对应 provider 的 API key
    text_openai_base_url = "https://api.siliconflow.cn/v1"  # 可选：自定义 API base URL（官方 OpenAI 可留空）

    # ===== API Keys 参考 =====
    # 主流 LLM Providers API Key 获取地址：
    #
    # OpenAI:       https://platform.openai.com/api-keys
    # Gemini:       https://makersuite.google.com/app/apikey
    # DeepSeek:     https://platform.deepseek.com/api_keys
    # Qwen (阿里):  https://bailian.console.aliyun.com/?tab=model#/api-key
    # SiliconFlow:  https://cloud.siliconflow.cn/account/ak (手机号注册)
    # Moonshot:     https://platform.moonshot.cn/console/api-keys
    # Anthropic:    https://console.anthropic.com/settings/keys
    # Cohere:       https://dashboard.cohere.com/api-keys
    # Together AI:  https://api.together.xyz/settings/api-keys

    ##########################################
    # 🔧 高级配置（可选）
    ##########################################

    # WebUI 界面是否显示配置项
    hide_config = true

    # 官方 OpenAI 默认端点（可选）：
    # text_openai_base_url = "https://api.openai.com/v1"

##########################################
# TTS (文本转语音) 配置
##########################################

[azure]
    # Azure TTS 配置
    # 获取密钥：https://portal.azure.com
    speech_key = ""
    speech_region = ""

[tencent]
    # 腾讯云 TTS 配置
    # 访问 https://console.cloud.tencent.com/cam/capi 获取密钥
    secret_id = ""
    secret_key = ""
    region = "ap-beijing"  # 地域配置

[soulvoice]
    # SoulVoice TTS API 配置
    api_key = ""
    voice_uri = "speech:mcg3fdnx:clzkyf4vy00e5qr6hywum4u84:bzznlkuhcjzpbosexitr"
    api_url = "https://tts.scsmtech.cn/tts"
    model = "FunAudioLLM/CosyVoice2-0.5B"

[tts_qwen]
    # 通义千问 Qwen3 TTS 配置
    # 访问 https://bailian.console.aliyun.com/?tab=model#/api-key 获取你的 API 密钥
    api_key = ""
    model_name = "qwen3-tts-flash"

[fun_asr]
    # 阿里百炼 Fun-ASR 字幕转录配置
    # 访问 https://bailian.console.aliyun.com/?tab=model#/api-key 获取你的 API 密钥
    api_key = ""
    model = "fun-asr"
    
[indextts2]
    # IndexTTS2 语音克隆配置
    # 这是一个开源的零样本语音克隆项目，需要自行部署
    # 项目地址：https://github.com/index-tts/index-tts
    # 默认 API 地址（本地部署）
    api_url = "http://127.0.0.1:8081/tts"
    
    # 默认参考音频路径（可选）
    # reference_audio = "/path/to/reference_audio.wav"
    
    # 推理模式：普通推理 / 快速推理
    infer_mode = "普通推理"
    
    # 高级参数
    temperature = 1.0
    top_p = 0.8
    top_k = 30
    do_sample = true
    num_beams = 3
    repetition_penalty = 10.0
[doubaotts]
    # 豆包语音 TTS 配置
    # 申请流程：
    # 1. 打开 https://console.volcengine.com/iam/keymanage 新建 Access Key 和 Secret Key
    # 2. 打开 https://www.volcengine.com/product/voice-tech 点击立即使用
    # 3. 在 API 服务中心找到音频生成下面的语音合成，获取 APPID 和 Token
    ak = ""
    sk = ""
    appid = ""
    token = ""
    cluster = "volcano_tts"
    
    # 高级参数
    volume = 1.0
    pitch = 1.0
    silence_duration = 0.125

[ui]
    # TTS引擎选择 (edge_tts, azure_speech, soulvoice, tencent_tts, tts_qwen, doubaotts)
    tts_engine = "edge_tts"

    # Edge TTS 配置
    edge_voice_name = "zh-CN-XiaoyiNeural-Female"
    voice_name = "zh-CN-XiaoyiNeural-Female"
    edge_volume = 80
    edge_rate = 1.0
    edge_pitch = 0

    # Azure Speech Services 配置
    azure_voice_name = "zh-CN-XiaoyiNeural-Female"
    azure_volume = 80
    azure_rate = 1.0
    azure_pitch = 0
    
    # 豆包语音 TTS 配置
    doubaotts_voice_type = "BV700_V2_streaming"
    doubaotts_rate = 1.0

    # 字幕位置（top / center / bottom / custom）
    subtitle_position = "custom"
    custom_position = 60.0

##########################################
# 代理和网络配置
##########################################

[proxy]
    # HTTP/HTTPS 代理配置（如需要）
    # clash 默认地址：http://127.0.0.1:7890
    http = ""
    https = ""
    enabled = false

##########################################
# 视频处理配置
##########################################

[film_tv]
# 规则方案: fazu2 | balanced_narration | original_heavy
preset_id = "fazu2"
# 影视解说 · 《罚罪2》悬疑脉络（原声约 48% / 解说约 52%）
target_duration_percent = 30
ost1_duration_min = 5
ost1_duration_max = 12
ost1_duration_long_max = 12
ost1_segment_min = 13
ost1_segment_max = 18
ost0_segment_min = 13
ost0_segment_max = 18
min_total_segments = 30
max_total_segments = 36
picture_chars_max = 12
original_audio_percent = 48
narration_percent = 52
allow_consecutive_ost1 = true
enforce_narration_after_ost1 = true
narration_chars_min = 48
narration_chars_max = 72
opening_chars_max = 110
# 视觉模型增强：字幕分析 + 关键帧（使用设置页 vision 模型）
enable_vision_enrichment = true
vision_scene_interval_sec = 30
vision_max_scene_samples = 80
vision_enrich_picture = true
vision_enrich_narration = true
vision_picture_max_items = 30
vision_segment_max_items = 30
# 开场白 / 结尾（{work_name} 或 某某某 替换为作品名）
enable_opening_closing_hook = true
opening_hook_template = "宝子们，今天咱们一起追《{work_name}》。"
closing_hook_template = "本集的核心冲突、留下的悬念和下一集的火药桶，就先帮大家梳理到这儿。宝子们，觉得讲清楚了点个赞，咱们下期再见。"

[frames]
    # 提取关键帧的间隔时间（秒）
    frame_interval_input = 3

    # 大模型单次处理的关键帧数量
    vision_batch_size = 10

    # 视觉批处理最大并发批次数（OpenAI 兼容 provider）
    vision_max_concurrency = 2

[documentary]
    # 逐帧解说：在爆燃/恐怖/尖叫等关键场面自动插入 OST=1 纯原声段
    enable_original_audio_highlights = true
    ost1_duration_min = 3
    ost1_duration_max = 12
    ost1_every_n_segments = 10
    max_ost1_segments = 0
    default_narration_ost = 2
    # 解说风格：资深解说员、灵活应变、亲民易懂；enable_humor_narration 控制适度网络梗与轻松点评
    enable_humor_narration = true
    context_window_sec = 30
    enable_action_expression_modifiers = true
    enable_logic_roast = true
    # 全片覆盖：尽量不漏段；每 coverage_interval_sec 秒至少一段解说
    enable_full_timeline_coverage = true
    coverage_interval_sec = 30
    narration_chars_min = 20
    narration_chars_max = 40
    default_custom_prompt = "尽量覆盖全片时间线，每 30 秒至少一段解说，不要大段跳过。"
    default_video_theme = "罚罪2"
    append_custom_prompt = ""
    # 有 SRT 时与抽帧分析交叉验证（对白以字幕为准，表情动作以画面为准）
    enable_subtitle_enrichment = true
    subtitle_max_chars = 15000
    subtitle_analysis_max_frame_chars = 8000
    subtitle_batch_pad_sec = 5
    # 对照抽帧校正 ASR 字幕（WebUI 第三步，输出 *_refined.srt）
    enable_subtitle_refinement = true
    subtitle_refinement_max_entries_per_call = 25
    subtitle_refinement_temperature = 0.3
    subtitle_refinement_min_similarity = 0.5
    subtitle_refinement_max_length_ratio_delta = 0.4
    # 硬字幕 OCR 校准（裁剪关键帧底部，输出 *_ocr_refined.srt，优先于 *_refined.srt）
    enable_hard_subtitle_ocr = true
    auto_subtitle_calibration_on_frame_analysis = true
    subtitle_ocr_crop_ratio = 0.22
    subtitle_ocr_batch_size = 10
    subtitle_ocr_max_concurrency = 2
    subtitle_ocr_match_pad_ms = 1500
    subtitle_ocr_min_confidence_frames = 1
    subtitle_ocr_min_similarity = 0.5
    subtitle_ocr_max_length_ratio_delta = 0.35
    frame_interval_input = 3
    # 解说生成上下文控制（长视频自动分块）
    narration_input_max_chars = 65000
    narration_input_max_tokens = 85000
    narration_compact_markdown_chars = 120000
    narration_chunk_max_chars = 50000
    narration_chunk_max_sections = 30
    narration_chunk_max_items_per_call = 15
    narration_segment_max_retries = 3
    # 脚本生成 max_tokens 建议 12000–16000；temperature 建议 0.3–0.5
    narration_script_max_tokens = 16000
    narration_script_temperature = 0.4

[documentary_compact]
    # 逐帧精剪：故事讲述型（35–50 段，原声 5–10 段，解说 30–100 字/段）
    documentary_compact_mode = true
    documentary_compact_style = "fazu2"
    default_narration_ost = 0
    enable_full_timeline_coverage = false
    target_output_minutes = 12
    target_output_ratio = 0.3
    frame_interval_input = 3
    min_total_segments = 35
    max_total_segments = 50
    ost0_segment_min = 30
    enable_picture_narration = false
    enable_humor_narration = false
    enable_logic_roast = false
    context_window_sec = 45
    narration_chars_min = 30
    narration_chars_max = 100
    ost1_duration_min = 1
    ost1_duration_max = 8
    ost1_duration_hard_max = 10
    min_ost1_segments = 5
    max_ost1_segments = 10
    ost1_every_n_segments = 10
    # 全片核心主题（可选，留空则用 WebUI「视频主题」或由模型自拟，如「为谁而战」）
    fazu2_core_theme = ""
    # 首尾招呼：{work_name} 替换为 WebUI「视频主题」；也可在 WebUI「开场白/结尾」中修改
    enable_opening_closing_hook = true
    opening_hook_template = "宝子们，我们开始《{work_name}》啦！"
    closing_hook_template = "宝子们，我们下期再见！"
    narration_chunk_max_items_per_call = 15
    narration_script_max_tokens = 16000
    narration_script_temperature = 0.4
    # 完整规则由 WebUI「自定义提示词」反显（get_compact_custom_prompt_display），此处可留空
    default_custom_prompt = ""
    default_video_theme = "罚罪2"
    # 本集/本片专属要求，由 WebUI「追加提示词」编辑，叠加在自定义提示词之后
    append_custom_prompt = ""

##########################################
# 完美字幕（影视解说：解说 + 原声双轨）
##########################################

[perfect_subtitle]
    # 是否启用完美字幕（OST=0 ASR 对齐 + OST=1 源字幕切片）
    enabled = true
    # ASR 提供方: auto | fun_asr | whisper_api
    provider = "auto"
    # OST=1 原声段优先从源 SRT 切片
    ost1_from_source_srt = true
    # 源 SRT 无匹配时，对片段音频做 ASR 回退
    ost1_asr_fallback = true
    # OST=0 解说段对 TTS 音频做 ASR 获取精确时间轴
    ost0_use_asr = true
    # 解说段优先使用 TTS 引擎字幕（与配音更同步）；原声段 ASR 后会按视频时长校正
    prefer_existing_tts_subtitle = true
    # 额外导出解说/原文分轨 SRT（便于剪映分样式）
    export_separate_tracks = true
    # 先合成成片（水印/旁白/BGM 正常），最后再 API 转写并烧录主字幕
    defer_asr_until_final = false
    narration_label = ""
    original_label = ""
    max_chars = 18
    max_duration = 6.0

[video_output]
    # 成片水印文字（留空则不添加水印；横屏 16:9 垂直居中靠右、上下 10% 浮动）
    watermark_text = "@小超剪辑"
    # 原声段（OST=1）是否在画面左侧上方显示旁白字幕（画面/动作/情绪描述，取自脚本 picture 字段）
    enable_picture_narration = true
    picture_narration_font_size = 44
    picture_narration_color = "#FFE066"
    picture_narration_max_chars = 12
    picture_narration_duration = 2.0
    # OST=1 原片播放时的主字幕颜色（对白/ASR 转写，与白色解说字幕区分）
    original_subtitle_color = "#FFE066"

[transcription]
    enable_fallback = true
    fallback_order = ["fun_asr", "whisper_api", "gemini_asr"]
    max_chars = 20
    max_duration = 3.5
    preprocess_audio = true
    max_upload_mb = 24.0
    chunk_seconds = 600
    ssl_verify = true
    include_speaker_label = false

[whisper_asr]
    api_key = ""
    model = "whisper-1"
    base_url = "https://api.openai.com/v1"
    language = "zh"
    engine = "api"

[gemini_asr]
    api_key = ""
    model = "gemini-2.0-flash"
    base_url = "https://api.openai.com/v1"
    language = "zh"
